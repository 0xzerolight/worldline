name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Same Qt 6.10 / Plasma 6 as the target desktop; ubuntu-latest ships neither.
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make python3 \
            qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes qml6-module-qtquick-effects qml6-module-qtquick-window \
            plasma-desktoptheme qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils
      - uses: actions/checkout@v7
      - run: make check
